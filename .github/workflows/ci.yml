name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: PHP ${{ matrix.php }} / ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database:
          - name: MySQL 8.4
            image: mysql:8.4
          - name: MariaDB 11.4
            image: mariadb:11.4

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: waymark_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: waymark_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:KBRoK9V5HuswYGJYIBr33RbHtZqfL/PZ/Rfij5fPeTc=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: waymark_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer verify:repository

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:tooling

  browser:
    name: Browser visual and accessibility checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:KBRoK9V5HuswYGJYIBr33RbHtZqfL/PZ/Rfij5fPeTc=
      APP_DEBUG: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  performance:
    name: Public performance budgets
    runs-on: ubuntu-latest
    env:
      APP_ENV: browser-testing
      APP_KEY: base64:KBRoK9V5HuswYGJYIBr33RbHtZqfL/PZ/Rfij5fPeTc=
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/test-results/performance.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      WAYMARK_TEST_NOW: '2026-08-20 12:00:00'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/prepare-browser-db.mjs
      - run: php artisan serve --no-reload --host=127.0.0.1 --port=8000 > /tmp/waymark-performance-server.log 2>&1 &
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/ > /dev/null
      - run: npm run test:performance
